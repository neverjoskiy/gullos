# GullDesk OS terminal defaults. Generated by tools/gen-terminal-theme;
# ~/.config/alacritty/alacritty.toml takes precedence.

[general]
# The dark colours, then the user's choice from GullDesk Settings (a later
# import wins; a missing file is skipped).
import = [
    "/usr/share/gulldesk/terminal/dark.toml",
    "~/.config/alacritty/gulldesk-colors.toml",
]
live_config_reload = true

[window]
padding = { x = 16, y = 12 }
dynamic_padding = true
dynamic_title = true

# Debian's shell start-up files name the window after the prompt
# ("user@host: ~") only for xterm-like terminals; without this the window
# stays titled "Alacritty".
[env]
TERM = "xterm-256color"

[font]
normal = { family = "Hack", style = "Regular" }
size = 11.0

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 20000

[selection]
save_to_clipboard = false
