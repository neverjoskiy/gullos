#
# /etc/pacman.conf - GullOS Arch Linux Binary Package Manager Configuration
#

[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = x86_64

# Visual enhancements & parallel downloads
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = root
DisableSandbox

# Keyring initialized & populated via `pacman-key --init && pacman-key --populate archlinux`
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
