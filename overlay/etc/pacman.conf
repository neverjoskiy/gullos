#
# /etc/pacman.conf - GullOS Arch Linux Binary Package Manager Configuration
#

[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = x86_64

# Visual enhancements & parallel downloads
Color
# Pacman cannot check disk space from within a chroot environment, so the
# upstream Arch ISO profile disables it as well. Leaving it enabled makes
# every pacman transaction in the bootstrap chroot fail with
# "could not determine filesystem mount points".
#CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = root
DisableSandbox

# Keyring initialized & populated via `pacman-key --init && pacman-key --populate archlinux`
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
