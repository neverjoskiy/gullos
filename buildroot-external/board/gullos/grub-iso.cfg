set default=0
set timeout=4

insmod all_video
insmod gfxterm
terminal_output gfxterm

# Catppuccin Mocha GRUB colors
set menu_color_normal=light-gray/black
set menu_color_highlight=magenta/black

menuentry "GullOS 0.1.0 Live / Installer (Wayland Desktop)" {
    search --no-floppy --file --set=root /live/rootfs.squashfs
    linux /boot/bzImage boot=live quiet loglevel=3 net.ifnames=0
    initrd /boot/initramfs-live.img
}

menuentry "GullOS 0.1.0 Live (Raw TTY Console Fallback Mode)" {
    search --no-floppy --file --set=root /live/rootfs.squashfs
    linux /boot/bzImage boot=live loglevel=7 net.ifnames=0 gullos.tty=1
    initrd /boot/initramfs-live.img
}
