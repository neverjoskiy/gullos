# Partition layout specification for GullOS persistent disk image (disk.raw -> gullos-x86_64.vdi)
# Partition 1: 1 MiB BIOS Boot Partition (ef02) for Legacy BIOS GRUB core.img
# Partition 2: 128 MiB FAT32 EFI System Partition (ef00) for UEFI BOOTX64.EFI
# Partition 3: ~11.8 GiB ext4 (GULLOS_ROOT) writable root filesystem for persistent pacman installs

image efi-part.vfat {
    vfat {
        extraargs = "-F 32 -n GULLOS_EFI"
    }
    size = 128M
}

image disk.raw {
    hdimage {
        partition-table-type = "gpt"
        gpt-location = 1M
    }

    partition bios-boot {
        offset = 2M
        size = 1M
        partition-type-uuid = "21686148-6449-6E6F-744E-656564454649"
    }

    partition efi {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        bootable = "true"
        image = "efi-part.vfat"
    }

    partition rootfs {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.ext4"
    }
}
