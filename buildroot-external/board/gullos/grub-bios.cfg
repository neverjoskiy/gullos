set default=0
set timeout=3

insmod all_video
insmod gfxterm
terminal_output gfxterm

# Catppuccin Mocha GRUB colors
set menu_color_normal=light-gray/black
set menu_color_highlight=magenta/black

menuentry "GullOS 0.1.0 (x86_64 Wayland - Persistent Disk)" {
    search --no-floppy --label --set=root GULLOS_ROOT
    linux /boot/bzImage root=LABEL=GULLOS_ROOT rw rootwait quiet loglevel=3 vt.global_cursor_default=1 net.ifnames=0
}

menuentry "GullOS 0.1.0 (Verbose Kernel Log / Recovery TTY)" {
    search --no-floppy --label --set=root GULLOS_ROOT
    linux /boot/bzImage root=LABEL=GULLOS_ROOT rw rootwait loglevel=7 net.ifnames=0 gullos.tty=1
}
