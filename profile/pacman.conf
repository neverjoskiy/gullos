# /etc/pacman.conf for the GullOS archiso profile (live ISO).
# Vanilla Arch base + CachyOS kernel (linux-cachyos) + local gullos repo (gull-*).

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = root
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Local gullos repo (gull-sh, gull-term, gull-lock) ---
# Populated by CI (build-packages job) at /gullos-local-repo.
# Placed above online repos so gull-* files are owned by pacman.
[gullos]
SigLevel = Optional TrustAll
Server = file:///gullos-local-repo

# --- CachyOS repo (source for linux-cachyos ONLY) ---
# The Server lines are injected by scripts/build.sh at build time by fetching
# the current official repo block from https://wiki.cachyos.org (do NOT
# hardcode Server URLs from memory). Everything else stays vanilla Arch.
# CACHYOS_REPO_BLOCK_START
# CACHYOS_REPO_BLOCK_END

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
