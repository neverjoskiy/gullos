set timeout=5
set default=0

menuentry "GullOS (CachyOS kernel) [default]" {
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=GULLOS_$(date +%Y%m) cow_spacesize=4G
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "GullOS (standard Arch kernel)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=GULLOS_$(date +%Y%m) cow_spacesize=4G
    initrd /arch/boot/x86_64/initramfs-linux.img
}
EOF
