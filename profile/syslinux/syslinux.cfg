DEFAULT gull-cachyos
PROMPT 1
TIMEOUT 50

LABEL gull-cachyos
  MENU LABEL GullOS (CachyOS kernel)
  LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos
  INITRD /arch/boot/x86_64/initramfs-linux-cachyos.img
  APPEND archisobasedir=arch archisolabel=GULLOS cow_spacesize=4G

LABEL gull-linux
  MENU LABEL GullOS (standard Arch kernel)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=GULLOS cow_spacesize=4G
