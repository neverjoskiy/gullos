---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
- id:       welcome
  module:   welcome
- id:       locale
  module:   locale
- id:       keyboard
  module:   keyboard
- id:       partition
  module:   partition
- id:       users
  module:   users
- id:       summary
  module:   summary
- id:       mount
  module:   mount
- id:       unpackfs
  module:   unpackfs
- id:       machineid
  module:   machineid
- id:       fstab
  module:   fstab
- id:       localecfg
  module:   localecfg
- id:       keyboardcfg
  module:   keyboardcfg
- id:       userscfg
  module:   users
- id:       services-systemd
  module:   services
- id:       initcpiocfg
  module:   initcpiocfg
- id:       initcpio
  module:   initcpio
- id:       grubcfg
  module:   grubcfg
- id:       bootloader
  module:   bootloader
- id:       umount
  module:   umount
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localecfg
  - keyboardcfg
  - userscfg
  - services-systemd
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - umount
branding: gullos
prompt-install: true
EOF
