name: Build GullOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gullos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Validate Rust Userland (gull-sh, gull-term, gull-lock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-workspace -> target"

      - name: Run unit tests & release compile check
        run: |
          cargo test --manifest-path rust-workspace/Cargo.toml --workspace
          cargo build --manifest-path rust-workspace/Cargo.toml --workspace --release

  build-packages:
    name: Build gull-* packages (makepkg)
    needs: rust-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel cargo rust git archlinux-keyring pacman-contrib sudo
          # makepkg refuses to run as root; create a dedicated build user
          useradd -m -G wheel builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Build packages
        run: |
          export CI=true
          chmod +x scripts/build.sh scripts/build-disk-image.sh
          chown -R builder:builder .
          runuser -u builder -- bash -c 'cd "$PWD" && ./scripts/build.sh packages'

      - name: Upload local repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: gullos-local-repo
          path: build/gullos-local-repo/
          retention-days: 7

  build-iso:
    name: Build GullOS ISO (mkarchiso)
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Install archiso tooling
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso mkinitcpio grub efibootmgr dosfstools

      - name: Download local repo artifact
        uses: actions/download-artifact@v4
        with:
          name: gullos-local-repo
          path: build/gullos-local-repo/

      - name: Build ISO
        run: |
          export CI=true
          export GULLOS_BUILD_ROOT="$PWD/build"
          ./scripts/build.sh iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: gullos-iso
          path: |
            dist/gullos-x86_64.iso
            dist/SHA256SUMS.iso
          retention-days: 14

  build-vdi:
    name: Build GullOS VDI (persistent disk)
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Install disk-image tooling
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed arch-install-scripts parted dosfstools e2fsprogs grub efibootmgr qemu-img zstd

      - name: Download local repo artifact
        uses: actions/download-artifact@v4
        with:
          name: gullos-local-repo
          path: build/gullos-local-repo/

      - name: Build VDI
        run: |
          export CI=true
          export GULLOS_BUILD_ROOT="$PWD/build"
          ./scripts/build.sh vdi

      - name: Upload VDI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gullos-vdi
          path: |
            dist/gullos-x86_64.vdi.zst
          retention-days: 14

  release:
    name: Publish GitHub Release (on tag)
    needs: [build-iso, build-vdi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gullos-x86_64.iso
            dist/gullos-x86_64.vdi.zst
            dist/SHA256SUMS*
